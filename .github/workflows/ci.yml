name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to full commit SHAs (tag in the trailing comment).
jobs:
  checks:
    name: Lint, typecheck, test
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1 (version from packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          # Pinned to the Deno the Supabase Edge Runtime is built on, so a passing check means
          # the function will boot there. Bump it together with the runtime, never on its own.
          deno-version: v2.1.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # ESLint ignores `supabase/` and `pnpm typecheck` only walks the workspace packages, so
      # without this the Edge Functions would be the one place no tool looks.
      - run: pnpm check:functions
      # Type-checking does not prove the app bundles. Metro resolves modules its own way, and
      # the workspace packages reach it through pnpm's symlinks, so an export is the cheapest
      # thing that actually runs the bundler over the real dependency graph. It needs no
      # EXPO_PUBLIC_* values: config is read lazily at runtime, not at module load.
      - run: pnpm --filter @hype2gether/mobile bundle

  gitleaks:
    name: Secret scan
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks (checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" "$base/$archive"
          curl -sSfL -o "$RUNNER_TEMP/checksums.txt" "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          (cd "$RUNNER_TEMP" && grep " ${archive}\$" checksums.txt | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan full git history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose .'

  db:
    name: Database tests and generated types
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A migration that has already been merged has run against the hosted databases. Editing
      # it makes their schema disagree with the repository, so the only way forward is a new
      # migration.
      - name: Fail if an already-merged migration changed
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          edited=$(git diff --name-only --diff-filter=MDR \
            "origin/${{ github.base_ref }}...HEAD" -- 'supabase/migrations/*.sql')
          if [ -n "$edited" ]; then
            echo "Migrations are append-only. These were modified, deleted or renamed:"
            echo "$edited"
            exit 1
          fi
      # Throw-away local stack on the runner; never touches the hosted projects or any .env.
      - run: pnpm db:start
      - run: pnpm test:db
      - name: Fail if generated DB types are stale
        run: |
          pnpm gen:types
          git diff --exit-code -- packages/shared/src/db.types.ts
      - name: Fail if the Edge Function copy of the shared packages is stale
        run: |
          pnpm build:functions
          git diff --exit-code -- supabase/functions/_shared
      - if: always()
        run: pnpm db:stop
